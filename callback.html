<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying...</title>
</head>
<body>
  <h2>Verification Result</h2>
  <pre id="output">Processing Truecaller response...</pre>

  <script>
    // URL parameters read karein
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get("requestId");
    const endpoint = urlParams.get("endpoint"); // Profile fetch karne ka endpoint
    const accessToken = urlParams.get("accessToken"); // Agar token mila ho

    const savedRequestId = sessionStorage.getItem("tc_request_id");

    if (requestId && requestId === savedRequestId) {
      document.getElementById("output").textContent = 
        "Verification Successful!\n" + 
        "Endpoint: " + endpoint + "\n" +
        "Access Token: " + accessToken;

      // Note: User profile ka secure data fetch karne ke liye backend server se
      // Truecaller ke endpoint par GET request bhejni hoti hai.
    } else {
      document.getElementById("output").textContent = "Verification Failed ya Invalid Request ID.";
    }
  </script>
</body>
</html>
